<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — IFounderIt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, sans-serif;
      background: #f4f6fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .check {
      width: 64px; height: 64px;
      background: #F0FDF4;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
    }
    .logo { font-size: 16px; font-weight: 700; color: #0D1117; margin-bottom: 32px; }
    .logo span { color: #1D4ED8; }
    h1 { font-family: Georgia, serif; font-size: 26px; color: #0D1117; margin-bottom: 10px; }
    .sub { font-size: 15px; color: #64748B; line-height: 1.5; margin-bottom: 8px; }
    .tier-badge {
      display: inline-block; margin: 16px 0 24px;
      background: #EFF6FF; border: 1px solid #BFDBFE;
      color: #1D4ED8; font-size: 13px; font-weight: 700;
      border-radius: 20px; padding: 6px 16px;
    }
    .redirect-msg { font-size: 13px; color: #94A3B8; margin-top: 24px; }
    .bar-wrap { background: #E2E8F0; border-radius: 4px; height: 4px; margin-top: 10px; overflow: hidden; }
    .bar { height: 100%; background: #1D4ED8; width: 0%; border-radius: 4px; transition: width 1.8s linear; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">IFounder<span>It</span></div>
    <div class="check">✓</div>
    <h1>You're in.</h1>
    <p class="sub">Payment confirmed. Your access has been unlocked.</p>
    <div class="tier-badge" id="tier-badge">Loading...</div>
    <p class="sub" id="tier-desc"></p>
    <p class="redirect-msg">Taking you back to the app...</p>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const tier = params.get('tier');

    const tiers = {
      single: {
        label: 'Single Report Unlocked',
        desc: 'You have 1 report credit ready to use.',
        credits: 1
      },
      pack: {
        label: '3-Report Pack Unlocked',
        desc: 'You have 3 report credits ready to use.',
        credits: 3
      },
      founding: {
        label: 'Founding Member — Lifetime Access',
        desc: 'Unlimited reports, forever. Welcome to the founding crew.',
        credits: 9999
      }
    };

    const config = tiers[tier] || tiers['single'];

    // Set localStorage
    const existing = parseInt(localStorage.getItem('reportCredits') || '0');
    if (tier === 'founding') {
      localStorage.setItem('reportCredits', '9999');
      localStorage.setItem('paidTier', 'founding');
    } else {
      localStorage.setItem('reportCredits', String(existing + config.credits));
      localStorage.setItem('paidTier', tier);
    }
    localStorage.setItem('emailGatePassed', 'true');

    // Update UI
    document.getElementById('tier-badge').textContent = config.label;
    document.getElementById('tier-desc').textContent = config.desc;

    // Animate bar then redirect
    setTimeout(() => {
      document.getElementById('bar').style.width = '100%';
    }, 100);

    setTimeout(() => {
      window.location.href = 'https://ifounderit.com';
    }, 2000);
  </script>
</body>
</html>
